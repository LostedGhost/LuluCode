<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Niveaux de risque et décisions de permission</title>
  <desc id="d">Quatre niveaux de risque, de la lecture aux actions destructrices, et trois décisions possibles : autoriser une fois, autoriser pour la session, refuser.</desc>
  <defs>
    <linearGradient id="risk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="0.38" stop-color="#58a6ff"/>
      <stop offset="0.68" stop-color="#d29922"/>
      <stop offset="1" stop-color="#f85149"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="429" rx="20" fill="#0d1117" stroke="#30363d"/>

  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="500" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#e6edf3">Quatre niveaux de risque, trois décisions</text>
    <rect x="40" y="62" width="920" height="8" rx="4" fill="url(#risk)"/>

    <!-- niveau 0 -->
    <rect x="40" y="88" width="215" height="232" rx="14" fill="#161b22" stroke="#3fb950"/>
    <circle cx="74" cy="124" r="18" fill="#3fb950"/>
    <text x="74" y="131" text-anchor="middle" font-size="20" font-weight="800" fill="#0d1117">0</text>
    <text x="60" y="168" font-size="18" font-weight="700" fill="#e6edf3">Lecture</text>
    <g font-size="13.5" fill="#c9d1d9">
      <text x="60" y="196">Lire un fichier,</text>
      <text x="60" y="216">chercher dans le code,</text>
      <text x="60" y="236">lire un document</text>
    </g>
    <line x1="60" y1="252" x2="235" y2="252" stroke="#30363d"/>
    <g font-size="13" font-weight="600" fill="#3fb950">
      <text x="60" y="276">Autorisable en bloc</text>
      <text x="60" y="296">pour la session</text>
    </g>

    <!-- niveau 1 -->
    <rect x="275" y="88" width="215" height="232" rx="14" fill="#161b22" stroke="#58a6ff"/>
    <circle cx="309" cy="124" r="18" fill="#58a6ff"/>
    <text x="309" y="131" text-anchor="middle" font-size="20" font-weight="800" fill="#0d1117">1</text>
    <text x="295" y="168" font-size="18" font-weight="700" fill="#e6edf3">Écriture et réseau</text>
    <g font-size="13.5" fill="#c9d1d9">
      <text x="295" y="196">Modifier un fichier,</text>
      <text x="295" y="216">rechercher en ligne,</text>
      <text x="295" y="236">lire une page web</text>
    </g>
    <line x1="295" y1="252" x2="470" y2="252" stroke="#30363d"/>
    <g font-size="13" font-weight="600" fill="#58a6ff">
      <text x="295" y="276">Confirmation, avec la</text>
      <text x="295" y="296">différence affichée</text>
    </g>

    <!-- niveau 2 -->
    <rect x="510" y="88" width="215" height="232" rx="14" fill="#161b22" stroke="#d29922"/>
    <circle cx="544" cy="124" r="18" fill="#d29922"/>
    <text x="544" y="131" text-anchor="middle" font-size="20" font-weight="800" fill="#0d1117">2</text>
    <text x="530" y="168" font-size="18" font-weight="700" fill="#e6edf3">Commandes</text>
    <g font-size="13.5" fill="#c9d1d9">
      <text x="530" y="196">Lancer un test,</text>
      <text x="530" y="216">installer une dépendance,</text>
      <text x="530" y="236">lancer un script</text>
    </g>
    <line x1="530" y1="252" x2="705" y2="252" stroke="#30363d"/>
    <g font-size="13" font-weight="600" fill="#d29922">
      <text x="530" y="276">Confirmation, avec liste</text>
      <text x="530" y="296">d'exceptions sûres</text>
    </g>

    <!-- niveau 3 -->
    <rect x="745" y="88" width="215" height="232" rx="14" fill="#161b22" stroke="#f85149"/>
    <circle cx="779" cy="124" r="18" fill="#f85149"/>
    <text x="779" y="131" text-anchor="middle" font-size="20" font-weight="800" fill="#0d1117">3</text>
    <text x="765" y="168" font-size="18" font-weight="700" fill="#e6edf3">Destructif</text>
    <g font-size="13.5" fill="#c9d1d9">
      <text x="765" y="196">Supprimer, écraser,</text>
      <text x="765" y="216">sudo, accès hors zone,</text>
      <text x="765" y="236">envoyer des données</text>
    </g>
    <line x1="765" y1="252" x2="940" y2="252" stroke="#30363d"/>
    <g font-size="13" font-weight="600" fill="#f85149">
      <text x="765" y="276">Confirmation à chaque</text>
      <text x="765" y="296">fois, jamais pour toute</text>
      <text x="765" y="316">la session</text>
    </g>

    <!-- décisions -->
    <text x="500" y="350" text-anchor="middle" font-size="14" fill="#8b949e">Pour chaque demande, vous choisissez</text>
    <g font-size="16" font-weight="700" text-anchor="middle" fill="#e6edf3">
      <rect x="60" y="364" width="270" height="44" rx="22" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950"/>
      <text x="195" y="392">Autoriser une fois</text>
      <rect x="365" y="364" width="270" height="44" rx="22" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff"/>
      <text x="500" y="392">Autoriser pour la session</text>
      <rect x="670" y="364" width="270" height="44" rx="22" fill="#f85149" fill-opacity="0.12" stroke="#f85149"/>
      <text x="805" y="392">Refuser</text>
    </g>
  </g>
</svg>
