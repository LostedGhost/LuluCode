[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lulucode"
version = "0.1.0"
description = "Un agent de code open source qui tourne chez vous, avec le modèle de votre choix."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ludel Topanou" }]
keywords = ["agent", "code", "ollama", "openai", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
terminal = ["rich>=13.7"]
web = ["fastapi>=0.111", "uvicorn>=0.30"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
lulucode = "lulucode.cli.main:app"

[project.urls]
Homepage = "https://github.com/LostedGhost/LuluCode"
Issues = "https://github.com/LostedGhost/LuluCode/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
