<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Session LuluCode dans le terminal</title>
  <desc id="d">L'utilisateur demande l'ajout d'un test pour la fonction calculer_total. LuluCode lit src/factures.py (autorisé pour la session), propose un test avec un diff surligné en vert, puis demande l'autorisation d'écrire le fichier avec trois options : une fois, pour la session, refuser.</desc>
  <style>
    .t-reponse { opacity: 0; animation: t-in 0.6s cubic-bezier(0.22,1,0.36,1) forwards; }
    .t-l1 { animation-delay: 0.2s; }
    .t-l2 { animation-delay: 0.5s; }
    .t-l3 { animation-delay: 0.8s; }
    .t-diff { animation-delay: 1.1s; }
    .t-perm { animation-delay: 1.5s; }
    .t-user { animation: t-in 0.6s cubic-bezier(0.22,1,0.36,1); }
    @keyframes t-in { to { opacity: 1; } }
    .t-curseur { animation: t-blink 1.2s step-end infinite; }
    @keyframes t-blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .t-reponse, .t-user { animation: none; opacity: 1; }
      .t-curseur { animation: none; }
    }
  </style>

  <!-- fenêtre -->
  <rect x="0.5" y="0.5" width="899" height="499" rx="14" fill="#0d1117" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="899" height="44" rx="14" fill="#161b22"/>
  <rect x="0.5" y="30" width="899" height="14.5" fill="#161b22"/>
  <line x1="0" y1="44.5" x2="900" y2="44.5" stroke="#30363d"/>
  <circle cx="24" cy="22" r="6" fill="#f85149"/>
  <circle cx="46" cy="22" r="6" fill="#d29922"/>
  <circle cx="68" cy="22" r="6" fill="#3fb950"/>
  <text x="450" y="27" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">lulucode, ~/projets/api</text>

  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15">
    <text x="30" y="80"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> lulucode</tspan></text>
    <text x="30" y="106" fill="#8b949e">LuluCode 0.1  |  profil local  |  mode normal  |  dossier ~/projets/api</text>

    <text class="t-user" x="30" y="146"><tspan fill="#22d3ee" font-weight="700">&gt;</tspan><tspan fill="#e6edf3" font-weight="600"> Ajoute un test pour la fonction calculer_total</tspan></text>

    <g class="t-reponse t-l1"><text x="30" y="186" fill="#e6edf3">Je commence par lire src/factures.py pour comprendre la fonction.</text></g>
    <g class="t-reponse t-l2"><text x="30" y="212"><tspan fill="#3fb950">[lecture]</tspan><tspan fill="#e6edf3"> src/factures.py  </tspan><tspan fill="#8b949e">autorisé pour la session</tspan></text></g>

    <g class="t-reponse t-l3"><text x="30" y="252" fill="#e6edf3">Voici le test que je propose :</text></g>

    <!-- différence -->
    <g class="t-reponse t-diff">
      <rect x="30" y="266" width="840" height="68" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="46" y="292" fill="#3fb950">+ def test_calculer_total_avec_tva():</text>
      <text x="46" y="318" fill="#3fb950">+     assert calculer_total(100, tva=0.18) == 118</text>
    </g>

    <!-- demande de permission -->
    <g class="t-reponse t-perm">
      <rect x="30" y="356" width="840" height="124" rx="10" fill="#d29922" fill-opacity="0.07" stroke="#d29922"/>
      <text x="50" y="388" fill="#d29922" font-weight="700">Autoriser l'écriture de tests/test_factures.py ?</text>
      <text y="420">
        <tspan x="50" fill="#3fb950" font-weight="700">[o]</tspan><tspan fill="#e6edf3"> une fois</tspan>
        <tspan x="300" fill="#58a6ff" font-weight="700">[s]</tspan><tspan fill="#e6edf3"> pour la session</tspan>
        <tspan x="600" fill="#f85149" font-weight="700">[n]</tspan><tspan fill="#e6edf3"> refuser</tspan>
      </text>
      <text x="50" y="456"><tspan fill="#22d3ee" font-weight="700">&gt;</tspan></text>
      <rect class="t-curseur" x="68" y="443" width="9" height="17" fill="#22d3ee"/>
    </g>
  </g>
</svg>
