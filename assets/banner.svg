<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">LuluCode, agent de code open source qui tourne en local</title>
  <desc id="d">Bannière du projet LuluCode : logotype, promesse « un agent de code qui tourne chez vous », pastilles Open source, Terminal, Interface web, Ollama et DocScan, et une fenêtre de code décorative avec curseur clignotant.</desc>
  <style>
    .b-titre, .pastille { opacity: 0; transform: translateY(8px); animation: b-in 0.7s cubic-bezier(0.22,1,0.36,1) forwards; }
    .b-logo { opacity: 0; animation: b-in 0.7s cubic-bezier(0.22,1,0.36,1) forwards; }
    .b-titre   { animation-delay: 0.15s; }
    .pastille  { animation-delay: 0.45s; }
    .pastille:nth-of-type(2) { animation-delay: 0.51s; }
    .pastille:nth-of-type(3) { animation-delay: 0.57s; }
    .pastille:nth-of-type(4) { animation-delay: 0.63s; }
    .pastille:nth-of-type(5) { animation-delay: 0.69s; }
    @keyframes b-in { to { opacity: 1; transform: translateY(0); } }
    .b-curseur { animation: b-blink 1.2s step-end infinite; }
    @keyframes b-blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .b-titre, .pastille, .b-logo { animation: none; opacity: 1; transform: none; }
      .b-curseur { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1b1646"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>

  <!-- halos décoratifs -->
  <circle cx="1080" cy="-10" r="190" fill="#a78bfa" fill-opacity="0.10"/>
  <circle cx="60" cy="320" r="170" fill="#22d3ee" fill-opacity="0.08"/>

  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- logo -->
    <g class="b-logo">
      <rect x="70" y="80" width="116" height="116" rx="26" fill="url(#accent)"/>
      <text x="128" y="152" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="56" font-weight="700" fill="#0b1020" text-anchor="middle">&gt;_</text>

      <!-- titre -->
      <text class="b-titre" x="210" y="150" font-size="76" font-weight="800" fill="url(#accent)">LuluCode</text>
      <text class="b-titre" x="214" y="192" font-size="26" fill="#c9d1d9">L'agent de code open source qui tourne chez vous</text>
    </g>

    <!-- pastilles -->
    <g font-size="16" fill="#e6edf3" text-anchor="middle">
      <g class="pastille">
        <rect x="214" y="214" width="131" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#22d3ee" stroke-opacity="0.5"/>
        <text x="279.5" y="237">Open source</text>
      </g>
      <g class="pastille">
        <rect x="359" y="214" width="104" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#22d3ee" stroke-opacity="0.5"/>
        <text x="411" y="237">Terminal</text>
      </g>
      <g class="pastille">
        <rect x="477" y="214" width="150" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#22d3ee" stroke-opacity="0.5"/>
        <text x="552" y="237">Interface web</text>
      </g>
      <g class="pastille">
        <rect x="641" y="214" width="86" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#22d3ee" stroke-opacity="0.5"/>
        <text x="684" y="237">Ollama</text>
      </g>
      <g class="pastille">
        <rect x="741" y="214" width="95" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#22d3ee" stroke-opacity="0.5"/>
        <text x="788.5" y="237">DocScan</text>
      </g>
    </g>
  </g>

  <!-- fenêtre décorative -->
  <g>
    <rect x="900" y="60" width="240" height="180" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#22d3ee" stroke-opacity="0.35"/>
    <circle cx="922" cy="82" r="5" fill="#f85149"/>
    <circle cx="940" cy="82" r="5" fill="#d29922"/>
    <circle cx="958" cy="82" r="5" fill="#3fb950"/>
    <rect x="922" y="108" width="120" height="8" rx="4" fill="#22d3ee" fill-opacity="0.7"/>
    <rect x="922" y="128" width="170" height="8" rx="4" fill="#a78bfa" fill-opacity="0.6"/>
    <rect x="922" y="148" width="90" height="8" rx="4" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="922" y="168" width="150" height="8" rx="4" fill="#22d3ee" fill-opacity="0.45"/>
    <rect x="922" y="188" width="60" height="8" rx="4" fill="#a78bfa" fill-opacity="0.6"/>
    <rect class="b-curseur" x="922" y="210" width="10" height="14" fill="#22d3ee"/>
  </g>
</svg>
