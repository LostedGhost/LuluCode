<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="t d">
  <title id="t">Architecture de LuluCode</title>
  <desc id="d">Deux façades, le terminal et l'interface web, partagent un flux d'événements avec le cœur de l'agent. Le cœur contient la couche modèle, les permissions, le journal et les outils. La couche modèle parle à Ollama ou à un service distant, et les outils peuvent appeler DocScan.</desc>
  <style>
    .a-couche { opacity: 0; animation: a-in 0.7s cubic-bezier(0.22,1,0.36,1) forwards; }
    .a-facades { animation-delay: 0.1s; }
    .a-flux    { animation-delay: 0.4s; }
    .a-coeur   { animation-delay: 0.7s; }
    .a-ext     { animation-delay: 1.0s; }
    @keyframes a-in { to { opacity: 1; } }
    .a-tirets { stroke-dasharray: 6 8; animation: a-courant 1.4s linear infinite; }
    @keyframes a-courant { to { stroke-dashoffset: -14; } }
    @media (prefers-reduced-motion: reduce) {
      .a-couche { animation: none; opacity: 1; }
      .a-tirets { animation: none; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="659" rx="20" fill="#0d1117" stroke="#30363d"/>

  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="500" y="34" font-size="18" fill="#8b949e">Un cœur, deux façades</text>

    <!-- façades -->
    <g class="a-couche a-facades">
      <rect x="120" y="56" width="300" height="84" rx="14" fill="#0e2a33" stroke="#22d3ee"/>
      <text x="270" y="92" font-size="19" font-weight="700" fill="#e6edf3">Façade terminal</text>
      <text x="270" y="118" font-size="14" fill="#9fb3c8">Typer et Rich</text>

      <rect x="580" y="56" width="300" height="84" rx="14" fill="#0e2a33" stroke="#22d3ee"/>
      <text x="730" y="92" font-size="19" font-weight="700" fill="#e6edf3">Façade web</text>
      <text x="730" y="118" font-size="14" fill="#9fb3c8">React et FastAPI, flux SSE</text>

      <path d="M270 142 V188" stroke="#8b949e" stroke-width="2" fill="none" marker-start="url(#ah)" marker-end="url(#ah)"/>
      <path d="M730 142 V188" stroke="#8b949e" stroke-width="2" fill="none" marker-start="url(#ah)" marker-end="url(#ah)"/>
    </g>

    <!-- flux d'événements -->
    <g class="a-couche a-flux">
      <rect x="60" y="190" width="880" height="72" rx="14" fill="#1c1637" stroke="#a78bfa"/>
      <text x="500" y="222" font-size="18" font-weight="700" fill="#e6edf3">Flux d'événements, le même pour les deux façades</text>
      <text x="500" y="246" font-size="13" fill="#b8a9e6">texte en continu, demande d'outil, demande de permission, différence de fichier, résultat, fin de tâche</text>
    </g>

    <path class="a-couche a-flux" d="M500 264 V298" stroke="#8b949e" stroke-width="2" fill="none" marker-start="url(#ah)" marker-end="url(#ah)"/>

    <!-- cœur -->
    <g class="a-couche a-coeur">
      <rect x="50" y="300" width="900" height="190" rx="18" fill="#0f1a16" stroke="#3fb950" stroke-dasharray="7 5"/>
      <text x="500" y="330" font-size="16" font-weight="700" fill="#3fb950">Cœur : boucle d'agent, bibliothèque Python sans interface</text>

      <!-- couche modèle -->
      <rect x="80" y="346" width="186" height="124" rx="12" fill="#161b22" stroke="#30363d"/>
      <rect x="96" y="358" width="40" height="4" rx="2" fill="#58a6ff"/>
      <text x="173" y="386" font-size="16" font-weight="700" fill="#e6edf3">Couche modèle</text>
      <g font-size="12.5" fill="#9fb3c8">
        <text x="173" y="414">Client format OpenAI</text>
        <text x="173" y="434">Profils local, distant</text>
        <text x="173" y="454">Validation des appels</text>
      </g>

      <!-- permissions -->
      <rect x="298" y="346" width="186" height="124" rx="12" fill="#161b22" stroke="#30363d"/>
      <rect x="314" y="358" width="40" height="4" rx="2" fill="#d29922"/>
      <text x="391" y="386" font-size="16" font-weight="700" fill="#e6edf3">Permissions</text>
      <g font-size="12.5" fill="#9fb3c8">
        <text x="391" y="414">Niveaux de risque 0 à 3</text>
        <text x="391" y="434">Une fois, session, refus</text>
        <text x="391" y="454">Modes normal et strict</text>
      </g>

      <!-- journal -->
      <rect x="516" y="346" width="186" height="124" rx="12" fill="#161b22" stroke="#30363d"/>
      <rect x="532" y="358" width="40" height="4" rx="2" fill="#8b949e"/>
      <text x="609" y="386" font-size="16" font-weight="700" fill="#e6edf3">Journal</text>
      <g font-size="12.5" fill="#9fb3c8">
        <text x="609" y="414">Chaque action tracée</text>
        <text x="609" y="434">Décisions enregistrées</text>
        <text x="609" y="454">Secrets masqués</text>
      </g>

      <!-- outils -->
      <rect x="734" y="346" width="186" height="124" rx="12" fill="#161b22" stroke="#30363d"/>
      <rect x="750" y="358" width="40" height="4" rx="2" fill="#3fb950"/>
      <text x="827" y="386" font-size="16" font-weight="700" fill="#e6edf3">Outils</text>
      <g font-size="12.5" fill="#9fb3c8">
        <text x="827" y="414">Fichiers, commandes</text>
        <text x="827" y="434">Recherche de code, web</text>
        <text x="827" y="454">Lecture de documents</text>
      </g>
    </g>

    <!-- liaisons et sorties -->
    <g class="a-couche a-ext">
      <path class="a-tirets" d="M173 470 V530 H155 V558" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#ah)"/>
      <path class="a-tirets" d="M173 530 H385 V558" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#ah)"/>
      <path class="a-tirets" d="M827 470 V558" stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#ah)"/>

      <!-- modèles -->
      <rect x="50" y="560" width="210" height="72" rx="12" fill="#102a1a" stroke="#3fb950"/>
      <text x="155" y="592" font-size="16" font-weight="700" fill="#e6edf3">Ollama, llama.cpp</text>
      <text x="155" y="614" font-size="13" fill="#9fb3c8">Modèle local</text>

      <rect x="280" y="560" width="210" height="72" rx="12" fill="#102a1a" stroke="#3fb950"/>
      <text x="385" y="592" font-size="16" font-weight="700" fill="#e6edf3">Service distant</text>
      <text x="385" y="614" font-size="13" fill="#9fb3c8">Clé dans une variable</text>

      <!-- DocScan -->
      <rect x="734" y="560" width="186" height="72" rx="12" fill="#2a1d0b" stroke="#d29922"/>
      <text x="827" y="592" font-size="16" font-weight="700" fill="#e6edf3">DocScan</text>
      <text x="827" y="614" font-size="13" fill="#9fb3c8">Outil optionnel</text>
    </g>
  </g>
</svg>
